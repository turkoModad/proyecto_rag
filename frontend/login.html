<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asistente Vial</title>
    <link rel="stylesheet" href="/frontend/css/styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>🛡️ Asistente Vial</h2>
            <p>Inicia sesión para continuar</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn">Entrar</button>
        </form>

        <div class="auth-footer">
            <span>¿No tienes cuenta?</span>
            <a href="/frontend/register.html">Crear cuenta</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);

    const response = await fetch('/auth/login', {
        method: 'POST',
        body: formData,
        credentials: "include"
    });

    const data = await response.json();

    if (response.ok) {
        if (data.redirect) {
            window.location.href = data.redirect;
        } else {
            window.location.href = "/";
        }
    } else {
        alert(data.detail || "Error al iniciar sesión");
    }
};
</script>

</body>
</html>
