<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Login - Asistente Vial</title>

<link rel="stylesheet" href="/frontend/css/auth.css?v=1.0.1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>🛡️ Asistente Vial</h2>
            <p>Inicia sesión para continuar</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" name="password" placeholder="••••••••" required>
                    <span class="toggle-pass">👁️</span>
                </div>
            </div>

            <button type="submit" class="auth-btn">Entrar</button>

            <!-- Enlace para recuperar contraseña -->
            <div class="forgot-password-link" style="text-align: center; margin-top: 15px;">
                <a href="/auth/forgot-password" style="color: #1a73e8; text-decoration: none; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
            </div>
        </form>

        <div class="auth-footer">
            <p>¿No tienes cuenta?</p>
            <a href="/frontend/register.html" class="auth-btn" style="color: white">Crear cuenta</a>
        </div>
    </div>
</div>

<script>
// Toggle password visibility
document.querySelectorAll('.toggle-pass').forEach(el => {
    el.addEventListener('click', () => {
        const input = el.previousElementSibling;
        if (input.type === 'password') {
            input.type = 'text';
            el.textContent = '🙈';
        } else {
            input.type = 'password';
            el.textContent = '👁️';
        }
    });
});

// Login form submission
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);

    const response = await fetch('/auth/login', {
        method: 'POST',
        body: formData,
        credentials: "include"
    });

    const data = await response.json();

    if (response.ok) {
        window.location.replace(data.redirect || "/frontend/index.html");
    } else {
        alert(data.detail || "Error al iniciar sesión");
    }
};
</script>

<script src="/frontend/js/app.js?v=1.1"></script>
</body>
</html>
