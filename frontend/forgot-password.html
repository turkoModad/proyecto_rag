<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Recuperar contraseña - Asistente Vial</title>
<link rel="stylesheet" href="/frontend/css/auth.css?v=1.0.6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
<h2>🔐 Recuperar contraseña</h2>
<p>Te enviaremos un enlace para restablecerla</p>
</div>

<form id="forgotForm" class="auth-form">

<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="tu@email.com" required>
</div>

<button type="submit" class="auth-btn">Enviar enlace</button>
</form>

<div class="auth-footer">
    <p style="margin-bottom: 10px; color: #666;">¿Recordaste tu contraseña?</p>
    <a href="/frontend/login.html">Volver al inicio de sesión</a>
</div>

</div>
</div>

<script>
document.getElementById('forgotForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.querySelector('button');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Enviando...";

    try {
        const res = await fetch('/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
            credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
            alert(data.message || "Revisa tu correo. Si está registrado, recibirás las instrucciones.");
            window.location.href = "/frontend/login.html";
        } else {
            alert(data.detail || "Error al procesar la solicitud");
        }
    } catch (err) {
        console.error(err);
        alert("Error de conexión");
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
};
</script>

</body>
</html>
