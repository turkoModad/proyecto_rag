<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Registro - Asistente Vial</title>
<link rel="stylesheet" href="/frontend/css/auth.css?v=1.0.6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
<h2>🛡️ Crear Cuenta</h2>
<p>Regístrate para usar el asistente</p>
</div>

<form id="registerForm" class="auth-form">

<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="tu@email.com" required>
</div>

<div class="form-group password-wrapper">
<label>Contraseña</label>
<input type="password" id="password" placeholder="••••••••" required>
<span class="password-toggle" id="togglePassword">👁️</span>
</div>

<!-- Contenedor de requisitos de contraseña -->
<div class="requirements-container" id="requirementsContainer">
    <div class="requirement" id="req-length">
        <span class="icon">❌</span>
        <span class="text">Mínimo 8 caracteres</span>
    </div>
    <div class="requirement" id="req-uppercase">
        <span class="icon">❌</span>
        <span class="text">Una letra mayúscula</span>
    </div>
    <div class="requirement" id="req-number">
        <span class="icon">❌</span>
        <span class="text">Un número</span>
    </div>
    <div class="requirement" id="req-special">
        <span class="icon">❌</span>
        <span class="text">Un carácter especial (!@#$%^&*)</span>
    </div>
</div>

<div class="password-strength" id="strengthMessage"></div>

<div class="form-group password-wrapper">
<label>Confirmar contraseña</label>
<input type="password" id="password2" placeholder="••••••••" required>
<span class="password-toggle" id="togglePassword2">👁️</span>
</div>
<div id="passError" style="color:#e74c3c; font-size:0.75rem; margin-top:5px; display:none;">❌ Las contraseñas no coinciden</div>

<button type="submit" class="auth-btn">Registrarse</button>
</form>

<div class="auth-footer">
    <p style="margin-bottom: 10px; color: #666;">¿Ya tienes cuenta?</p>
    <a href="/frontend/login.html">Iniciar sesión</a>
</div>

</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // BLOQUEAR BOTÓN ATRÁS EN REGISTER
    history.replaceState(null, document.title, location.href);
    window.addEventListener('popstate', () => {
        history.replaceState(null, document.title, location.href);
    });

    const pass1 = document.getElementById("password");
    const pass2 = document.getElementById("password2");
    const toggle1 = document.getElementById("togglePassword");
    const toggle2 = document.getElementById("togglePassword2");
    const error = document.getElementById("passError");
    const strengthMessage = document.getElementById("strengthMessage");
    
    // Elementos de requisitos
    const reqLength = document.getElementById("req-length");
    const reqUppercase = document.getElementById("req-uppercase");
    const reqNumber = document.getElementById("req-number");
    const reqSpecial = document.getElementById("req-special");

    // =========================
    // VALIDACIÓN CONTRASEÑAS IGUALES
    // =========================
    function checkPasswords(){
        if(pass1.value !== pass2.value && pass2.value !== ""){
            error.style.display = "block";
            return false;
        } else {
            error.style.display = "none";
            return true;
        }
    }

    pass1.addEventListener("input", checkPasswords);
    pass2.addEventListener("input", checkPasswords);

    // =========================
    // TOGGLE PASSWORD VISIBILITY
    // =========================
    toggle1.addEventListener("click", () => {
        if(pass1.type === "password"){
            pass1.type = "text";
            toggle1.textContent = "🙈";
        } else {
            pass1.type = "password";
            toggle1.textContent = "👁️";
        }
    });

    toggle2.addEventListener("click", () => {
        if(pass2.type === "password"){
            pass2.type = "text";
            toggle2.textContent = "🙈";
        } else {
            pass2.type = "password";
            toggle2.textContent = "👁️";
        }
    });

    // =========================
    // VALIDACIÓN DE FORTALEZA DE CONTRASEÑA
    // =========================
    function updatePasswordStrength() {
        const password = pass1.value;
        
        // Validar cada requisito
        const lengthValid = password.length >= 8;
        const uppercaseValid = /[A-Z]/.test(password);
        const numberValid = /\d/.test(password);
        const specialValid = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        
        // Actualizar íconos y colores de requisitos
        updateRequirement(reqLength, lengthValid, "Mínimo 8 caracteres");
        updateRequirement(reqUppercase, uppercaseValid, "Una letra mayúscula");
        updateRequirement(reqNumber, numberValid, "Un número");
        updateRequirement(reqSpecial, specialValid, "Un carácter especial (!@#$%^&*)");
        
        // Calcular fortaleza general
        const isValid = lengthValid && uppercaseValid && numberValid && specialValid;
        
        // Actualizar mensaje de fortaleza
        if (!password) {
            strengthMessage.textContent = "";
            strengthMessage.className = "password-strength";
        } else if (isValid) {
            strengthMessage.textContent = "✅ Contraseña segura";
            strengthMessage.className = "password-strength strong";
        } else {
            const missing = [];
            if (!lengthValid) missing.push("8+ caracteres");
            if (!uppercaseValid) missing.push("mayúscula");
            if (!numberValid) missing.push("número");
            if (!specialValid) missing.push("carácter especial");
            strengthMessage.textContent = `⚠️ Requiere: ${missing.join(", ")}`;
            strengthMessage.className = "password-strength weak";
        }
        
        return isValid;
    }
    
    function updateRequirement(element, isValid, text) {
        if (isValid) {
            element.classList.add("valid");
            element.querySelector(".icon").textContent = "✅";
        } else {
            element.classList.remove("valid");
            element.querySelector(".icon").textContent = "❌";
        }
    }

    // Escuchar cambios en el campo de contraseña
    pass1.addEventListener("input", updatePasswordStrength);
    
    // Inicializar
    updatePasswordStrength();

    // =========================
    // REGISTER SUBMIT
    // =========================
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();

        if(!checkPasswords()) {
            alert("Las contraseñas no coinciden");
            return;
        }

        // Validar fortaleza de contraseña
        const isValid = updatePasswordStrength();
        if (!isValid) {
            alert("La contraseña no cumple los requisitos de seguridad:\n\n• Mínimo 8 caracteres\n• Una letra mayúscula\n• Un número\n• Un carácter especial (!@#$%^&*)");
            return;
        }

        const email = document.getElementById('email').value;
        const password = pass1.value;

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: "include"
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("isLogged", "true");
                window.location.replace(data.redirect || "/frontend/index.html");
            } else {
                alert(data.detail || "Error al registrarse");
            }

        } catch(err) {
            console.error(err);
            alert("Error de conexión");
        }
    };

});
</script>

</body>
</html>
