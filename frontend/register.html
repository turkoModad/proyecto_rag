<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Registro - Asistente Vial</title>
<link rel="stylesheet" href="/frontend/css/styles.css?v=2.2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.password-wrapper { position: relative; }
.password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    user-select: none;
}
</style>
</head>
<body>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
<h2>🛡️ Crear Cuenta</h2>
<p>Regístrate para usar el asistente</p>
</div>

<form id="registerForm" class="auth-form">

<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="tu@email.com" required>
</div>

<div class="form-group password-wrapper">
<label>Contraseña</label>
<input type="password" id="password" placeholder="••••••••" required>
<span class="password-toggle" id="togglePassword">👁️</span>
</div>

<div class="form-group password-wrapper">
<label>Confirmar contraseña</label>
<input type="password" id="password2" placeholder="••••••••" required>
<span class="password-toggle" id="togglePassword2">👁️</span>
<span id="passError" style="color:red;font-size:0.8rem;display:none;">Las contraseñas no coinciden</span>
</div>

<button type="submit" class="auth-btn">Registrarse</button>
</form>

<div class="auth-footer">
<span>¿Ya tienes cuenta?</span>
<a href="/frontend/login.html" class="auth-btn" style="color: white;">
Iniciar sesión
</a>
</div>

</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // BLOQUEAR BOTÓN ATRÁS EN REGISTER
    history.replaceState(null, document.title, location.href);
    window.addEventListener('popstate', () => {
        history.replaceState(null, document.title, location.href);
    });

    const pass1 = document.getElementById("password");
    const pass2 = document.getElementById("password2");
    const toggle1 = document.getElementById("togglePassword");
    const toggle2 = document.getElementById("togglePassword2");
    const error = document.getElementById("passError");

    // =========================
    // VALIDACIÓN CONTRASEÑAS
    // =========================
    function checkPasswords(){
        if(pass1.value !== pass2.value){
            error.style.display = "block";
            return false;
        } else {
            error.style.display = "none";
            return true;
        }
    }

    pass1.addEventListener("input", checkPasswords);
    pass2.addEventListener("input", checkPasswords);

    // =========================
    // TOGGLE PASSWORD VISIBILITY
    // =========================
    toggle1.addEventListener("click", () => {
        if(pass1.type === "password"){
            pass1.type = "text";
            toggle1.textContent = "🙈";
        } else {
            pass1.type = "password";
            toggle1.textContent = "👁️";
        }
    });

    toggle2.addEventListener("click", () => {
        if(pass2.type === "password"){
            pass2.type = "text";
            toggle2.textContent = "🙈";
        } else {
            pass2.type = "password";
            toggle2.textContent = "👁️";
        }
    });

    // =========================
    // REGISTER SUBMIT
    // =========================
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();

        if(!checkPasswords()) return;

        const email = document.getElementById('email').value;
        const password = pass1.value;

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: "include"
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("isLogged", "true");

                // Replace evita volver atrás al register
                window.location.replace(data.redirect || "/frontend/index.html");

            } else {
                alert(data.detail || "Error al registrarse");
            }

        } catch(err) {
            console.error(err);
            alert("Error de conexión");
        }
    };

});
</script>

</body>
</html>
