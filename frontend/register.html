<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Asistente Vial</title>
    <link rel="stylesheet" href="/frontend/css/styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>🛡️ Crear Cuenta</h2>
            <p>Regístrate para usar el asistente</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn">Registrarse</button>
        </form>

        <div class="auth-footer">
            <span>¿Ya tienes cuenta?</span>
            <a href="/frontend/login.html">Iniciar sesión</a>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
        credentials: "include"
    });

    const data = await response.json();

    if (response.ok) {
        window.location.href = "/";
    } else {
        alert(data.detail || "Error al registrarse");
    }
};
</script>

</body>
</html>
