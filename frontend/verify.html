<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Cuenta - Asistente Vial</title>
    <link rel="stylesheet" href="/frontend/css/styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Verificar Cuenta</h2>
            <p>Ingresa el código enviado a tu correo</p>
        </div>

        <form id="verifyForm" class="auth-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label>Código OTP</label>
                <input type="text" id="otp" placeholder="123456" required>
            </div>

            <button type="submit" class="auth-btn">Verificar</button>

            <p id="error" style="
                color:#dc2626;
                font-size:0.85rem;
                text-align:center;
                margin-top:8px;">
            </p>

        </form>

        <div class="auth-footer">
            <span>¿Ya verificaste tu cuenta?</span>
            <a href="/auth/login">Iniciar sesión</a>
        </div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const emailFromUrl = params.get("email");

if (emailFromUrl) {
    document.getElementById("email").value = emailFromUrl;
}

document.getElementById("verifyForm").onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const otp = document.getElementById("otp").value;

    const response = await fetch("/auth/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, otp }),
        credentials: "include" 
    });

    const data = await response.json();

    if (response.ok) {
       
        if (data.redirect) {
            window.location.href = data.redirect;
        } else {
            window.location.href = "/";
        }

    } else {
        document.getElementById("error").innerText =
            data.detail || "OTP incorrecto, intenta nuevamente";
    }
};
</script>

</body>
</html>
