<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Cuenta - Asistente Vial</title>
<link rel="stylesheet" href="/frontend/css/auth.css?v=1.0.1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Verificar Cuenta</h2>
            <p>Ingresa el código enviado a tu correo</p>
        </div>

        <form id="verifyForm" class="auth-form">
            <div class="form-group">
                <label>Código OTP</label>
                <input type="text" id="otp" placeholder="123456" required>
            </div>

            <button type="submit" class="auth-btn">Verificar</button>

            <p id="error" style="color:#dc2626;font-size:0.85rem;text-align:center;margin-top:8px;"></p>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Bloquear botón atrás
    history.replaceState(null, document.title, location.href);
    window.addEventListener('popstate', () => {
        history.replaceState(null, document.title, location.href);
    });

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const errorEl = document.getElementById("error");

    function mostrarError(mensaje) {
        errorEl.innerText = mensaje;
        errorEl.style.display = "block"; // Hacer visible
    }

    if (!token) {
        mostrarError("Token no encontrado en la URL.");
        document.getElementById("verifyForm").querySelector("button").disabled = true;
        return;
    }

    document.getElementById("verifyForm").onsubmit = async (e) => {
        e.preventDefault();

        const otp = document.getElementById("otp").value.trim();
        if (!otp) return;

        try {
            const response = await fetch("/auth/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, otp }),
                credentials: "include"
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("isLogged", "true");
                // Reemplazar historial para que no vuelva a verify
                window.location.replace(data.redirect || "/frontend/index.html");
            } else {
                mostrarError(data.detail || "OTP incorrecto, intenta nuevamente");
            }

        } catch (err) {
            console.error(err);
            mostrarError("Error de conexión con el servidor.");
        }
    };
});
</script>

</body>
</html>
