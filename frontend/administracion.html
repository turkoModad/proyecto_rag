<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px;
            border: none;
            background: #1e293b;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
        }

        button:hover {
            background: #334155;
        }

        .output {
            background: #020617;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            max-height: 80vh;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .title {
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>🛠 Admin Panel</h1>

<div class="container">
    <div class="menu">
        <button onclick="loadUsers()">👤 Ver usuarios</button>
        <button onclick="loadIPs()">🌐 Top IPs</button>
        <button onclick="loadIPsDetail()">📊 IPs detalle</button>
        <button onclick="loadIPsUsers()">👥 IPs + usuarios</button>
        <button onclick="loadEndpoints()">📡 Top endpoints</button>
    </div>

    <div class="output">
        <div class="title" id="title">Resultado</div>
        <pre id="result">Selecciona una opción...</pre>
    </div>
</div>

<script>
const API_BASE = "/admin";

function setOutput(title, data) {
    document.getElementById("title").innerText = title;
    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}

async function fetchData(endpoint, title) {
    try {
        const res = await fetch(API_BASE + endpoint, {
            credentials: "include"
        });

        if (!res.ok) {
            const text = await res.text();
            throw new Error(text);
        }

        const data = await res.json();
        setOutput(title, data);

    } catch (err) {
        setOutput("Error", err.message);
    }
}

// =========================
// USERS
// =========================
function loadUsers() {
    fetchData("/users", "Usuarios registrados");
}

// =========================
// IPS
// =========================
function loadIPs() {
    fetchData("/ips", "Top IPs por requests");
}

function loadIPsDetail() {
    fetchData("/ips/detail", "Detalle de IPs");
}

function loadIPsUsers() {
    fetchData("/ips/users", "IPs con usuarios");
}

// =========================
// ENDPOINTS
// =========================
function loadEndpoints() {
    fetchData("/top-endpoints", "Endpoints más usados");
}
</script>

</body>
</html>
