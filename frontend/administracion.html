<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Sistema RAG</title>
    <link rel="stylesheet" href="/frontend/css/administracion.css?v=1.0.5">
</head>
<body>

<h1>🛠 Admin Panel</h1>

<div class="container">
    <div class="menu">
        <button onclick="loadUsers()">👤 Ver usuarios</button>
        <button onclick="loadIPs()">🌐 Top IPs</button>
        <button onclick="loadIPsDetail()">📊 IPs detalle</button>
        <button onclick="loadIPsUsers()">👥 IPs + usuarios</button>
        <button onclick="loadEndpoints()">📡 Top endpoints</button>
        <hr>

        <button onclick="listAllQA()">📚 Ver QA (vector)</button>
        <button onclick="searchQA()">🔎 Buscar QA (texto)</button>
        <button onclick="searchSemantic()">🧠 Buscar semántico</button>
        <button onclick="ingestQA()">➕ Insertar QA</button>
        <button onclick="deleteQA()">❌ Eliminar por ID</button>
        <button onclick="deleteByFilter()">⚠️ Eliminar por filtro</button>

        <hr>
        <h3>Usuarios / IPs</h3>
        <button onclick="blockUser()">🚫 Bloquear usuario</button>
        <button onclick="unblockUser()">✅ Desbloquear usuario</button>
        <button onclick="makeAdmin()">⭐ Hacer admin</button>
        <button onclick="deleteUser()">❌ Eliminar usuario</button>
        <button onclick="blockIP()">🌐 Bloquear IP</button>

        <hr>
        <h3>Logs / QA</h3>
        <button onclick="loadQALogs()">📋 QA Logs</button>
        <button onclick="loadOutOfDomain()">⚠️ Preguntas fuera de dominio</button>
        <button onclick="loadVisits()">👥 Visitas únicas</button>
        <button onclick="loadReviews()">📝 Reviews</button>
        <button onclick="loadExamAttempts()">📊 Exam Attempts</button>
        <button onclick="loadMessages()">✉️ Mensajes</button>
        
        <hr>
        <button onclick="logoutAdmin()" style="background: #dc2626; text-align: center;">
            🚪 Cerrar sesión
        </button>
    </div>

    <div class="output">
        <div class="title" id="title">Resultado</div>
        <pre id="result">Selecciona una opción...</pre>
    </div>
</div>

<script src="/frontend/js/administracion.js?v=1.0.19"></script>
</body>
</html>
