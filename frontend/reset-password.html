<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Restablecer contraseña - Asistente Vial</title>
<link rel="stylesheet" href="/frontend/css/auth.css?v=1.0.6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-container">
<div class="auth-card">

<div class="auth-header">
<h2>🔄 Restablecer contraseña</h2>
<p>Ingresa tu nueva contraseña</p>
</div>

<form id="resetForm" class="auth-form">

<div class="form-group password-wrapper">
<label>Nueva contraseña</label>
<input type="password" id="new_password" placeholder="••••••••" required>
<span class="password-toggle" id="toggleNew">👁️</span>
</div>

<!-- Contenedor de requisitos de contraseña -->
<div class="requirements-container" id="requirementsContainer">
    <div class="requirement" id="req-length">
        <span class="icon">❌</span>
        <span class="text">Mínimo 8 caracteres</span>
    </div>
    <div class="requirement" id="req-uppercase">
        <span class="icon">❌</span>
        <span class="text">Una letra mayúscula</span>
    </div>
    <div class="requirement" id="req-number">
        <span class="icon">❌</span>
        <span class="text">Un número</span>
    </div>
    <div class="requirement" id="req-special">
        <span class="icon">❌</span>
        <span class="text">Un carácter especial (!@#$%^&*)</span>
    </div>
</div>

<div class="password-strength" id="strengthMessage"></div>

<div class="form-group password-wrapper">
<label>Confirmar contraseña</label>
<input type="password" id="confirm_password" placeholder="••••••••" required>
<span class="password-toggle" id="toggleConfirm">👁️</span>
</div>
<div id="passError" style="color:#e74c3c; font-size:0.75rem; margin-top:5px; display:none;">❌ Las contraseñas no coinciden</div>

<button type="submit" class="auth-btn">Restablecer contraseña</button>
</form>

<div class="auth-footer">
    <a href="/frontend/login.html">Volver al inicio de sesión</a>
</div>

</div>
</div>

<script>
// Obtener token de la URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    alert("Enlace inválido. Solicita un nuevo restablecimiento.");
    window.location.href = "/frontend/forgot-password.html";
}

document.addEventListener("DOMContentLoaded", () => {
    const newPass = document.getElementById("new_password");
    const confirmPass = document.getElementById("confirm_password");
    const toggleNew = document.getElementById("toggleNew");
    const toggleConfirm = document.getElementById("toggleConfirm");
    const error = document.getElementById("passError");
    const strengthMessage = document.getElementById("strengthMessage");
    
    const reqLength = document.getElementById("req-length");
    const reqUppercase = document.getElementById("req-uppercase");
    const reqNumber = document.getElementById("req-number");
    const reqSpecial = document.getElementById("req-special");

    function checkPasswords() {
        if (newPass.value !== confirmPass.value && confirmPass.value !== "") {
            error.style.display = "block";
            return false;
        } else {
            error.style.display = "none";
            return true;
        }
    }

    newPass.addEventListener("input", checkPasswords);
    confirmPass.addEventListener("input", checkPasswords);

    toggleNew.addEventListener("click", () => {
        if (newPass.type === "password") {
            newPass.type = "text";
            toggleNew.textContent = "🙈";
        } else {
            newPass.type = "password";
            toggleNew.textContent = "👁️";
        }
    });

    toggleConfirm.addEventListener("click", () => {
        if (confirmPass.type === "password") {
            confirmPass.type = "text";
            toggleConfirm.textContent = "🙈";
        } else {
            confirmPass.type = "password";
            toggleConfirm.textContent = "👁️";
        }
    });

    function updatePasswordStrength() {
        const password = newPass.value;
        
        const lengthValid = password.length >= 8;
        const uppercaseValid = /[A-Z]/.test(password);
        const numberValid = /\d/.test(password);
        const specialValid = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        
        updateRequirement(reqLength, lengthValid);
        updateRequirement(reqUppercase, uppercaseValid);
        updateRequirement(reqNumber, numberValid);
        updateRequirement(reqSpecial, specialValid);
        
        const isValid = lengthValid && uppercaseValid && numberValid && specialValid;
        
        if (!password) {
            strengthMessage.textContent = "";
            strengthMessage.className = "password-strength";
        } else if (isValid) {
            strengthMessage.textContent = "✅ Contraseña segura";
            strengthMessage.className = "password-strength strong";
        } else {
            const missing = [];
            if (!lengthValid) missing.push("8+ caracteres");
            if (!uppercaseValid) missing.push("mayúscula");
            if (!numberValid) missing.push("número");
            if (!specialValid) missing.push("carácter especial");
            strengthMessage.textContent = `⚠️ Requiere: ${missing.join(", ")}`;
            strengthMessage.className = "password-strength weak";
        }
        
        return isValid;
    }
    
    function updateRequirement(element, isValid) {
        if (isValid) {
            element.classList.add("valid");
            element.querySelector(".icon").textContent = "✅";
        } else {
            element.classList.remove("valid");
            element.querySelector(".icon").textContent = "❌";
        }
    }

    newPass.addEventListener("input", updatePasswordStrength);
    updatePasswordStrength();

    document.getElementById('resetForm').onsubmit = async (e) => {
        e.preventDefault();

        if (!checkPasswords()) {
            alert("Las contraseñas no coinciden");
            return;
        }

        const isValid = updatePasswordStrength();
        if (!isValid) {
            alert("La contraseña no cumple los requisitos de seguridad:\n\n• Mínimo 8 caracteres\n• Una letra mayúscula\n• Un número\n• Un carácter especial (!@#$%^&*)");
            return;
        }

        const new_password = newPass.value;
        const confirm_password = confirmPass.value;

        const btn = document.querySelector('button');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Enviando...";

        try {
            const res = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password, confirm_password }),
                credentials: 'include'
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                window.location.href = "/frontend/login.html";
            } else {
                alert(data.detail || "Error al restablecer la contraseña");
            }
        } catch (err) {
            console.error(err);
            alert("Error de conexión");
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    };
});
</script>

</body>
</html>
